stages:
  - verify

verify:
  stage: verify
  image: node:24-bullseye
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^codex\/.*$/'
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git build-essential
    - curl -fsSL https://bun.sh/install | bash
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"
    - curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
    - export PATH="$HOME/.cargo/bin:$PATH"
  script:
    - if [ -f bun.lockb ]; then bun install --frozen-lockfile; else bun install; fi
    - ./scripts/bootstrap-toolchain.sh --check
    - bun run workflow:check-sync
    - bun run workflow:check
    - bun run verify
