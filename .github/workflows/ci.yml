name: ci

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: |
          if [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Toolchain preflight
        run: ./scripts/bootstrap-toolchain.sh --check
      - name: Verify
        run: bun run verify
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore
          retention-days: 7
